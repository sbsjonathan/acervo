<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Galeria de imagens em Cover Flow.">
  <meta name="theme-color" content="#151414">
  <title>Acervo — Catálogo de imagens</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true">
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 8.6c0 4.1-8.8 9.5-8.8 9.5s-8.8-5.4-8.8-9.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8.8 1.6Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m5.5 14.5 6.5-6.5 6.5 6.5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m5.5 9.5 6.5 6.5 6.5-6.5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4m-4 4 4-4 4 4M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="15.5" cy="8.5" r="1.5"/><path d="m3 17 5-5 4.5 4.5L16 13l5 5"/></symbol>
  </svg>

  <main class="shell main-content">
    <div class="flow-stage" id="flow-stage">
      <p class="loading" id="loading" role="status" hidden>Carregando imagens…</p>
      <div class="flow" id="flow" role="region" hidden aria-label="Galeria de imagens" aria-roledescription="carrossel">
        <div class="flow-viewport" id="flow-viewport" tabindex="0" aria-label="Capas da coleção. Use as setas do teclado para navegar.">
          <div class="flow-track" id="gallery"></div>
        </div>
        <div class="flow-caption">
          <label class="caption-line caption-author">
            <span id="author-caption" aria-hidden="true">Autor</span>
            <select class="caption-select" id="author-select" name="author" aria-label="Autor">
              <option value="">Autor</option>
              <option value="Yasmim">Yasmim</option>
              <option value="Áquila">Áquila</option>
              <option value="Jonathan">Jonathan</option>
              <option value="other">Outro</option>
            </select>
          </label>
          <label class="caption-line caption-category">
            <span id="category-caption" aria-hidden="true">Categoria</span>
            <select class="caption-select" id="category-select" name="category" aria-label="Categoria">
              <option value="">Categoria</option>
              <option value="Logo">Logo</option>
              <option value="Frases">Frases</option>
              <option value="Desenho">Desenho</option>
              <option value="Outro">Outro</option>
            </select>
          </label>
          <div class="cover-edit-action">
            <button class="button secondary replace-photo-button" id="replace-cover" type="button" hidden>Trocar foto</button>
          </div>
        </div>
        <p class="visually-hidden" id="flow-announcement" role="status" aria-atomic="true"></p>
        <div class="flow-controls">
          <div class="flow-counter" id="results"></div>
          <div class="flow-navigation">
            <button class="icon-button flow-nav-button" id="previous-image" type="button" aria-label="Álbum anterior"><svg aria-hidden="true"><use href="#i-back"/></svg></button>
            <button class="icon-button flow-nav-button" id="next-image" type="button" aria-label="Próximo álbum"><svg aria-hidden="true"><use href="#i-next"/></svg></button>
          </div>
          <div class="flow-actions">
            <button class="icon-button" id="flow-favorite" type="button" aria-label="Favoritar foto"><svg aria-hidden="true"><use href="#i-heart"/></svg></button>
            <button class="icon-button" id="variations-toggle" type="button" aria-label="Abrir variações" title="Variações" aria-haspopup="dialog" aria-controls="variations-dialog" aria-expanded="false"><svg aria-hidden="true"><use href="#i-up"/></svg></button>
          </div>
        </div>
      </div>
      <div class="empty-state" id="empty" hidden>
        <span class="empty-icon"><svg aria-hidden="true"><use href="#i-image"/></svg></span>
        <h3 id="empty-title">Não foi possível carregar as fotos</h3>
        <p id="empty-copy"></p>
        <button class="button secondary" id="empty-action" type="button">Tentar novamente</button>
      </div>
    </div>
    <p class="visually-hidden" id="slot-announcement" role="status" aria-atomic="true"></p>
    <input id="slot-file" type="file" accept="image/*" hidden>
    <input id="replacement-file" type="file" accept="image/*" hidden>
  </main>

  <dialog class="dialog variations-dialog" id="variations-dialog" aria-labelledby="variations-title" aria-describedby="variations-context">
    <header class="variations-header">
      <div>
        <h2 id="variations-title">Variações</h2>
        <p id="variations-context"></p>
      </div>
      <button class="icon-button" id="close-variations" type="button" aria-label="Fechar variações" title="Fechar variações" autofocus><svg aria-hidden="true"><use href="#i-down"/></svg></button>
    </header>
    <div class="variant-viewport" id="variant-viewport" tabindex="0" aria-label="Foto atual. Use as setas para cima e para baixo para trocar de foto.">
      <button class="variant-zoom" id="variant-zoom" type="button" aria-label="Ampliar foto">
        <img id="variant-image" alt="" draggable="false">
      </button>
    </div>
    <div class="variant-edit">
      <div class="variant-tools">
        <p class="flow-counter" id="variant-position" aria-live="polite" aria-atomic="true"></p>
        <button class="icon-button" id="variant-favorite" type="button" aria-label="Favoritar foto" aria-pressed="false"><svg aria-hidden="true"><use href="#i-heart"/></svg></button>
      </div>
      <div class="flow-caption variant-caption">
        <label class="caption-line caption-author">
          <span id="variant-author-caption" aria-hidden="true">Autor</span>
          <select class="caption-select" id="variant-author-select" name="author" aria-label="Autor">
            <option value="">Autor</option>
            <option value="Yasmim">Yasmim</option>
            <option value="Áquila">Áquila</option>
            <option value="Jonathan">Jonathan</option>
            <option value="other">Outro</option>
          </select>
        </label>
        <label class="caption-line caption-category">
          <span id="variant-category-caption" aria-hidden="true">Categoria</span>
          <select class="caption-select" id="variant-category-select" name="category" aria-label="Categoria">
            <option value="">Categoria</option>
            <option value="Logo">Logo</option>
            <option value="Frases">Frases</option>
            <option value="Desenho">Desenho</option>
            <option value="Outro">Outro</option>
          </select>
        </label>
      </div>
    </div>
    <div class="variant-strip">
      <div class="variant-thumbnails" id="variant-thumbnails" role="group" aria-label="Fotos e variações"></div>
      <button class="button secondary replace-photo-button" id="replace-variant" type="button">Trocar foto</button>
      <button class="icon-button" id="add-variations" type="button" aria-label="Adicionar variações" title="Adicionar variações"><svg aria-hidden="true"><use href="#i-plus"/></svg></button>
    </div>
    <p class="variant-status" id="variant-status" role="status" aria-atomic="true"></p>
    <input id="variant-files" type="file" accept="image/*" multiple hidden>
  </dialog>

  <dialog class="dialog author-dialog" id="author-dialog" aria-labelledby="author-dialog-title">
    <form id="author-form">
      <h2 id="author-dialog-title">Nome do autor</h2>
      <label class="visually-hidden" for="author-custom">Nome do autor</label>
      <input id="author-custom" name="author" type="text" autocomplete="off" maxlength="80" required autofocus>
      <div class="author-dialog-actions">
        <button class="button secondary" id="cancel-author" type="button">Cancelar</button>
        <button class="button primary" type="submit">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog detail-dialog" id="detail-dialog" aria-label="Visualização da foto">
    <button class="icon-button detail-close" type="button" data-close aria-label="Fechar foto"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
    <img id="detail-image" alt="">
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
